# GitLab CI for vauchi-assets
#
# Brand assets and images

include:
  - project: 'vauchi/scripts'
    ref: main
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/badges.yml'

stages:
  - lint
  - validate
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

validate:files:
  stage: validate
  image: alpine:3.21
  needs: []
  script:
    - echo "Validating asset files..."
    - test -f logo.svg || (echo "Missing logo.svg" && exit 1)
    - test -f logo.png || (echo "Missing logo.png" && exit 1)
    - echo "All required assets present"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
