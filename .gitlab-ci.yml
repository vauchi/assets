# GitLab CI for vauchi-assets
#
# Brand assets and images

stages:
  - lint
  - validate

reuse-lint:
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  stage: lint
  before_script:
    - command -v reuse >/dev/null 2>&1 || pip3 install --quiet reuse
  script:
    - reuse lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

validate:files:
  stage: validate
  image: alpine:latest
  script:
    - echo "Validating asset files..."
    - test -f logo.svg || (echo "Missing logo.svg" && exit 1)
    - test -f logo.png || (echo "Missing logo.png" && exit 1)
    - echo "All required assets present"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
