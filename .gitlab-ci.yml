# GitLab CI for vauchi-assets
#
# Brand assets and images

# Pipeline types: MR validation, main post-merge, tags.
# Prevents empty-pipeline failures on feature branch pushes.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.13
    file:
      - '/ci-templates/reuse.yml'
      - '/ci-templates/image-lint.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.13"

stages:
  - lint
  - validate
  - deploy

# REUSE compliance provided by vauchi/scripts ci-templates/reuse.yml

lint:images:
  extends: .image-lint

validate:files:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - echo "Validating asset files..."
    - test -f logo.svg || (echo "Missing logo.svg" && exit 1)
    - test -f logo.png || (echo "Missing logo.png" && exit 1)
    - echo "All required assets present"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# The per-platform pictogram files are derived from the drawn SVGs; a drawing
# edited without regenerating would ship stale icons to every shell (#473).
validate:pictograms:
  stage: validate
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  before_script:
    - apk add --no-cache python3
  script:
    - python3 pictograms/generate.py --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages

github-mirror:
  extends: .github-mirror
