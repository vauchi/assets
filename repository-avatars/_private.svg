<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Lock body -->
  <rect x="176" y="250" width="160" height="120" rx="16" fill="url(#g2)"/>
  <!-- Lock shackle -->
  <path d="M200,250 V200 C200,160 312,160 312,200 V250"
        fill="none" stroke="url(#g1)" stroke-width="20" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="256" cy="300" r="16" fill="#1a1a2e"/>
  <rect x="250" y="300" width="12" height="30" rx="4" fill="#1a1a2e"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="130" cy="380" r="6"/>
    <circle cx="382" cy="140" r="6"/>
    <circle cx="370" cy="380" r="4"/>
    <circle cx="140" cy="150" r="4"/>
  </g>

</svg>