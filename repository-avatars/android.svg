<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Body -->
  <rect x="166" y="260" width="180" height="120" rx="20" fill="url(#g1)"/>
  <!-- Head -->
  <rect x="176" y="180" width="160" height="90" rx="45" ry="45" fill="url(#g1)"/>
  <!-- Eyes -->
  <circle cx="220" cy="220" r="10" fill="#1a1a2e"/>
  <circle cx="292" cy="220" r="10" fill="#1a1a2e"/>
  <!-- Antennae -->
  <line x1="210" y1="180" x2="195" y2="148" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
  <line x1="302" y1="180" x2="317" y2="148" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="136" y="270" width="24" height="80" rx="12" fill="url(#g2)"/>
  <rect x="352" y="270" width="24" height="80" rx="12" fill="url(#g2)"/>
  <!-- Legs -->
  <rect x="200" y="370" width="24" height="50" rx="12" fill="url(#g2)"/>
  <rect x="288" y="370" width="24" height="50" rx="12" fill="url(#g2)"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="110" cy="380" r="5"/>
    <circle cx="400" cy="150" r="5"/>
  </g>

</svg>