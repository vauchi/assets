<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Terminal window -->
  <rect x="126" y="156" width="260" height="200" rx="14" fill="#16213e" stroke="#4fc3f7" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="126" y="156" width="260" height="32" rx="14" fill="url(#g1)" opacity="0.3"/>
  <rect x="126" y="175" width="260" height="13" fill="url(#g1)" opacity="0.3"/>
  <!-- Window buttons -->
  <circle cx="150" cy="172" r="6" fill="#4fc3f7" opacity="0.6"/>
  <circle cx="170" cy="172" r="6" fill="#26c6da" opacity="0.6"/>
  <circle cx="190" cy="172" r="6" fill="#0288d1" opacity="0.6"/>
  <!-- Prompt arrow > -->
  <path d="M155,230 L180,250 L155,270" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor block -->
  <rect x="200" y="238" width="14" height="24" rx="2" fill="#4fc3f7" opacity="0.8"/>
  <!-- Text lines -->
  <rect x="200" y="290" width="100" height="6" rx="3" fill="#4fc3f7" opacity="0.25"/>
  <rect x="200" y="310" width="70" height="6" rx="3" fill="#4fc3f7" opacity="0.15"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="110" cy="390" r="5"/>
    <circle cx="400" cy="130" r="5"/>
  </g>

</svg>