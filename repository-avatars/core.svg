           fill="url(#g2)"/>
  <!-- Center dot -->
  <circle cx="256" cy="250" r="12" fill="#fff" opacity="0.3"/>
  <!-- Radiating lines -->
  <g stroke="#4fc3f7" stroke-width="2" opacity="0.3">
    <line x1="256" y1="120" x2="256" y2="90"/>
    <line x1="360" y1="180" x2="385" y2="165"/>
    <line x1="360" y1="320" x2="385" y2="335"/>
    <line x1="256" y1="380" x2="256" y2="410"/>
    <line x1="152" y1="320" x2="127" y2="335"/>
    <line x1="152" y1="180" x2="127" y2="165"/>
