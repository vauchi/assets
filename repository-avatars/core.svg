<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Outer hex -->
  <polygon points="256,120 360,180 360,320 256,380 152,320 152,180"
           fill="none" stroke="url(#g1)" stroke-width="4" opacity="0.4"/>
  <!-- Inner hex -->
  <polygon points="256,160 330,200 330,300 256,340 182,300 182,200"
           fill="url(#g1)" opacity="0.8"/>
  <!-- Core diamond -->
