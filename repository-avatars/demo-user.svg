<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Person head -->
  <circle cx="230" cy="195" r="45" fill="url(#g1)"/>
  <!-- Person body -->
  <path d="M150,350 Q150,280 190,265 Q230,250 230,250 Q230,250 270,265 Q310,280 310,350 Z"
        fill="url(#g1)" opacity="0.85"/>
  <!-- Play triangle badge -->
  <g transform="translate(330, 310)">
    <circle cx="0" cy="0" r="45" fill="url(#g2)"/>
    <circle cx="0" cy="0" r="42" fill="#1a1a2e" opacity="0.15"/>
    <polygon points="-14,-22 -14,22 22,0" fill="#fff" opacity="0.85" transform="translate(4,0)"/>
  </g>
  <!-- Sparkle dots suggesting demo/preview -->
  <g fill="#4fc3f7" opacity="0.5">
    <circle cx="350" cy="235" r="4"/>
    <circle cx="370" cy="255" r="3"/>
    <circle cx="345" cy="260" r="2.5"/>
  </g>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="120" cy="390" r="5"/>
    <circle cx="395" cy="135" r="5"/>
  </g>

</svg>