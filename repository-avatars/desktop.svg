<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Monitor frame -->
  <rect x="126" y="140" width="260" height="190" rx="14" fill="#16213e" stroke="url(#g1)" stroke-width="3"/>
  <!-- Screen -->
  <rect x="140" y="154" width="232" height="148" rx="4" fill="url(#g1)" opacity="0.15"/>
  <!-- Window elements on screen -->
  <rect x="158" y="172" width="80" height="60" rx="6" fill="url(#g2)" opacity="0.5"/>
  <rect x="250" y="172" width="105" height="26" rx="4" fill="url(#g1)" opacity="0.3"/>
  <rect x="250" y="208" width="75" height="6" rx="3" fill="#4fc3f7" opacity="0.25"/>
  <rect x="250" y="224" width="90" height="6" rx="3" fill="#4fc3f7" opacity="0.15"/>
  <rect x="158" y="248" width="197" height="40" rx="6" fill="url(#g1)" opacity="0.2"/>
  <!-- Stand -->
  <rect x="230" y="330" width="52" height="30" fill="#16213e"/>
  <rect x="200" y="355" width="112" height="12" rx="6" fill="#16213e" stroke="url(#g1)" stroke-width="2"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="115" cy="390" r="5"/>
    <circle cx="400" cy="120" r="5"/>
  </g>

</svg>