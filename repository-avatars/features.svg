<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Pole -->
  <line x1="180" y1="140" x2="180" y2="390" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M184,155 L340,180 Q355,195 340,210 L184,235 Z" fill="url(#g1)"/>
  <!-- Toggle switches -->
  <g transform="translate(200, 275)">
    <!-- Toggle 1 on -->
    <rect x="0" y="0" width="50" height="26" rx="13" fill="url(#g2)"/>
    <circle cx="37" cy="13" r="10" fill="#fff" opacity="0.9"/>
    <!-- Toggle 2 on -->
    <rect x="70" y="0" width="50" height="26" rx="13" fill="url(#g2)"/>
    <circle cx="107" cy="13" r="10" fill="#fff" opacity="0.9"/>
    <!-- Toggle 3 off -->
    <rect x="140" y="0" width="50" height="26" rx="13" fill="#16213e" stroke="#4fc3f7" stroke-width="1.5"/>
    <circle cx="153" cy="13" r="10" fill="#4fc3f7" opacity="0.4"/>
  </g>
  <!-- Star on flag -->
  <polygon points="252,183 260,198 277,200 264,212 268,229 252,220 236,229 240,212 227,200 244,198"
           fill="#1a1a2e" opacity="0.3"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="395" cy="360" r="5"/>
    <circle cx="390" cy="140" r="5"/>
  </g>

</svg>