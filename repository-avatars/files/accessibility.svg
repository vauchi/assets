<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Head -->
  <circle cx="256" cy="155" r="28" fill="url(#g1)"/>
  <!-- Body -->
  <line x1="256" y1="183" x2="256" y2="300" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>
  <!-- Arms spread wide -->
  <line x1="170" y1="220" x2="342" y2="220" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="256" y1="300" x2="190" y2="390" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="322" y2="390" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>
  <!-- Enclosing circle -->
  <circle cx="256" cy="260" r="150" fill="none" stroke="url(#g2)" stroke-width="5" opacity="0.5"/>
  <!-- Radiating accessibility waves -->
  <path d="M138,145 Q120,190 130,240" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <path d="M118,155 Q95,205 108,260" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <path d="M374,145 Q392,190 382,240" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  <path d="M394,155 Q417,205 404,260" fill="none" stroke="#4fc3f7" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="125" cy="390" r="5"/>
    <circle cx="390" cy="130" r="5"/>
