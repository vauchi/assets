<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#g1)" stroke-width="30"/>
  <!-- Cross cuts to make lifebuoy shape -->
  <g stroke="#1a1a2e" stroke-width="34">
    <line x1="256" y1="120" x2="256" y2="170" stroke-linecap="butt"/>
    <line x1="256" y1="342" x2="256" y2="392" stroke-linecap="butt"/>
    <line x1="120" y1="256" x2="170" y2="256" stroke-linecap="butt"/>
    <line x1="342" y1="256" x2="392" y2="256" stroke-linecap="butt"/>
  </g>
  <!-- Teal accent segments -->
  <g>
    <path d="M256,131 A125,125 0 0,1 346,176" fill="none" stroke="url(#g2)" stroke-width="28" opacity="0.7"/>
    <path d="M166,336 A125,125 0 0,1 256,381" fill="none" stroke="url(#g2)" stroke-width="28" opacity="0.7"/>
  </g>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="55" fill="#1a1a2e"/>
  <!-- Question mark -->
  <text x="256" y="275" text-anchor="middle" font-family="sans-serif" font-size="65" font-weight="bold" fill="url(#g1)">?</text>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="125" cy="395" r="5"/>
    <circle cx="390" cy="125" r="5"/>
  </g>

</svg>