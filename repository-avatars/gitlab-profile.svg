<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- QR code background -->
  <rect x="160" y="155" width="192" height="192" rx="12" fill="#16213e" stroke="url(#g1)" stroke-width="2"/>
  <!-- QR pattern (simplified) -->
  <g fill="url(#g1)" opacity="0.7">
    <!-- Top-left finder -->
    <rect x="175" y="170" width="42" height="42" rx="4"/>
    <rect x="183" y="178" width="26" height="26" rx="2" fill="#1a1a2e"/>
    <rect x="190" y="185" width="12" height="12" rx="1" fill="url(#g1)"/>
    <!-- Top-right finder -->
    <rect x="295" y="170" width="42" height="42" rx="4"/>
    <rect x="303" y="178" width="26" height="26" rx="2" fill="#1a1a2e"/>
    <rect x="310" y="185" width="12" height="12" rx="1" fill="url(#g1)"/>
    <!-- Bottom-left finder -->
    <rect x="175" y="290" width="42" height="42" rx="4"/>
    <rect x="183" y="298" width="26" height="26" rx="2" fill="#1a1a2e"/>
    <rect x="190" y="305" width="12" height="12" rx="1" fill="url(#g1)"/>
    <!-- Data modules -->
    <rect x="230" y="175" width="10" height="10" rx="1"/>
    <rect x="250" y="175" width="10" height="10" rx="1"/>
    <rect x="270" y="175" width="10" height="10" rx="1"/>
    <rect x="230" y="195" width="10" height="10" rx="1"/>
    <rect x="260" y="225" width="10" height="10" rx="1"/>
    <rect x="240" y="245" width="10" height="10" rx="1"/>
    <rect x="280" y="245" width="10" height="10" rx="1"/>
    <rect x="300" y="245" width="10" height="10" rx="1"/>
    <rect x="260" y="265" width="10" height="10" rx="1"/>
    <rect x="240" y="295" width="10" height="10" rx="1"/>
    <rect x="260" y="315" width="10" height="10" rx="1"/>
    <rect x="300" y="295" width="10" height="10" rx="1"/>
    <rect x="320" y="315" width="10" height="10" rx="1"/>
  </g>
  <!-- Person silhouette overlay -->
  <circle cx="310" cy="345" r="18" fill="url(#g2)" opacity="0.9"/>
  <circle cx="310" cy="340" r="8" fill="#1a1a2e" opacity="0.5"/>
  <ellipse cx="310" cy="357" rx="11" ry="7" fill="#1a1a2e" opacity="0.5"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="120" cy="380" r="5"/>
    <circle cx="392" cy="130" r="5"/>
  </g>

</svg>