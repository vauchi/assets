<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Tux penguin body -->
  <ellipse cx="256" cy="280" rx="58" ry="74" fill="url(#g1)" opacity="0.8"/>
  <!-- Belly -->
  <ellipse cx="256" cy="296" rx="36" ry="50" fill="#1a1a2e" opacity="0.6"/>
  <ellipse cx="256" cy="296" rx="36" ry="50" fill="url(#g2)" opacity="0.3"/>
  <!-- Head -->
  <ellipse cx="256" cy="190" rx="44" ry="46" fill="url(#g1)" opacity="0.8"/>
  <!-- Eyes -->
  <circle cx="240" cy="180" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="272" cy="180" r="10" fill="#fff" opacity="0.9"/>
  <circle cx="242" cy="180" r="5" fill="#1a1a2e"/>
  <circle cx="274" cy="180" r="5" fill="#1a1a2e"/>
  <!-- Beak -->
  <path d="M244,200 L256,218 L268,200 Z" fill="#26c6da" opacity="0.9"/>
  <!-- Wings -->
  <path d="M198,260 Q170,240 176,300 Q186,330 198,320" fill="url(#g2)" opacity="0.6"/>
  <path d="M314,260 Q342,240 336,300 Q326,330 314,320" fill="url(#g2)" opacity="0.6"/>
  <!-- Feet -->
  <ellipse cx="232" cy="358" rx="22" ry="8" fill="url(#g2)" opacity="0.7"/>
  <ellipse cx="280" cy="358" rx="22" ry="8" fill="url(#g2)" opacity="0.7"/>
  <!-- GTK grid overlay -->
  <rect x="220" y="280" width="24" height="24" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.5"/>
  <rect x="248" y="280" width="24" height="24" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.5"/>
  <rect x="220" y="308" width="24" height="24" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.4"/>
  <rect x="248" y="308" width="24" height="24" rx="3" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.4"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="120" cy="400" r="5"/>
    <circle cx="395" cy="120" r="5"/>
  </g>

</svg>
