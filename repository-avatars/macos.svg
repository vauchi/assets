<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Apple stem -->
  <path d="M266,128 Q276,108 292,112" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"/>
  <!-- Apple leaf -->
  <path d="M268,130 Q286,118 296,130 Q286,136 268,130 Z" fill="url(#g2)" opacity="0.6"/>
  <!-- Apple body -->
  <path d="
    M256,148
    Q228,138 206,156
    Q172,186 178,240
    Q182,290 200,328
    Q216,360 236,370
    Q248,376 256,364
    Q264,376 276,370
    Q296,360 312,328
    Q330,290 334,240
    Q340,186 306,156
    Q284,138 256,148
    Z
  " fill="url(#g1)" opacity="0.8"/>
  <!-- Apple highlight -->
  <path d="
    M256,148
    Q228,138 206,156
    Q172,186 178,240
    Q182,270 192,300
    Q220,260 256,250
    Q256,200 256,148 Z
  " fill="url(#g2)" opacity="0.3"/>
  <!-- Apple bite -->
  <circle cx="330" cy="220" r="30" fill="#1a1a2e"/>
  <!-- Rounded square frame -->
  <rect x="136" y="100" width="240" height="280" rx="54" fill="none"
        stroke="url(#g1)" stroke-width="3" opacity="0.2"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="120" cy="410" r="5"/>
    <circle cx="400" cy="110" r="5"/>
  </g>

</svg>
