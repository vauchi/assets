<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Central node -->
  <circle cx="256" cy="256" r="35" fill="url(#g2)"/>
  <circle cx="256" cy="256" r="18" fill="#1a1a2e"/>
  <circle cx="256" cy="256" r="8" fill="#4fc3f7" opacity="0.8"/>
  <!-- Satellite nodes -->
  <circle cx="150" cy="170" r="22" fill="url(#g1)" opacity="0.8"/>
  <circle cx="362" cy="170" r="22" fill="url(#g1)" opacity="0.8"/>
  <circle cx="150" cy="345" r="22" fill="url(#g1)" opacity="0.8"/>
  <circle cx="362" cy="345" r="22" fill="url(#g1)" opacity="0.8"/>
  <!-- Bidirectional connection lines -->
  <g stroke="url(#g1)" stroke-width="3" opacity="0.5">
    <line x1="170" y1="185" x2="235" y2="240"/>
    <line x1="342" y1="185" x2="277" y2="240"/>
    <line x1="170" y1="332" x2="235" y2="272"/>
    <line x1="342" y1="332" x2="277" y2="272"/>
  </g>
  <!-- Arrow tips (small triangles) -->
  <g fill="url(#g1)" opacity="0.6">
    <polygon points="230,237 240,245 238,233" transform="rotate(-40 235 240)"/>
    <polygon points="282,237 272,245 274,233" transform="rotate(40 277 240)"/>
    <polygon points="230,275 240,267 238,279" transform="rotate(40 235 272)"/>
    <polygon points="282,275 272,267 274,279" transform="rotate(-40 277 272)"/>
  </g>
  <!-- Lightning bolt in center -->
  <path d="M253,244 L260,253 L254,253 L259,268 L252,259 L258,259 Z" fill="#fff" opacity="0.6"/>

