<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Terminal window -->
  <rect x="126" y="146" width="260" height="220" rx="14" fill="#16213e" stroke="url(#g2)" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="126" y="146" width="260" height="32" rx="14" fill="url(#g2)" opacity="0.3"/>
  <rect x="126" y="165" width="260" height="13" fill="url(#g2)" opacity="0.3"/>
  <!-- Window buttons -->
  <circle cx="150" cy="162" r="6" fill="#26c6da" opacity="0.6"/>
  <circle cx="170" cy="162" r="6" fill="#00838f" opacity="0.6"/>
  <circle cx="190" cy="162" r="6" fill="#4fc3f7" opacity="0.6"/>
  <!-- TUI box border -->
  <rect x="148" y="192" width="216" height="80" rx="2" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <!-- Header in box -->
  <rect x="158" y="200" width="80" height="8" rx="2" fill="url(#g2)" opacity="0.6"/>
  <!-- Menu items -->
  <rect x="158" y="220" width="120" height="6" rx="2" fill="#4fc3f7" opacity="0.2"/>
  <rect x="155" y="234" width="126" height="8" rx="2" fill="url(#g1)" opacity="0.4"/>
  <rect x="158" y="250" width="100" height="6" rx="2" fill="#4fc3f7" opacity="0.2"/>
  <!-- Selection highlight -->
  <rect x="152" y="232" width="132" height="12" rx="2" fill="url(#g1)" opacity="0.15"/>
  <!-- Status bar -->
  <rect x="148" y="290" width="216" height="20" rx="2" fill="url(#g2)" opacity="0.15"/>
  <rect x="158" y="296" width="60" height="6" rx="2" fill="#26c6da" opacity="0.4"/>
  <!-- Bottom prompt -->
  <path d="M150,335 L165,345 L150,355" fill="none" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="180" y="338" width="10" height="16" rx="2" fill="#26c6da" opacity="0.6"/>
  <!-- Accent dots -->
  <g fill="#26c6da" opacity="0.4">
    <circle cx="110" cy="395" r="5"/>
    <circle cx="400" cy="120" r="5"/>
  </g>

</svg>