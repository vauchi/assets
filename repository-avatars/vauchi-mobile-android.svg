<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Phone frame -->
  <rect x="176" y="120" width="160" height="280" rx="22" fill="#16213e" stroke="url(#g1)" stroke-width="3"/>
  <!-- Screen -->
  <rect x="188" y="148" width="136" height="224" rx="4" fill="url(#g1)" opacity="0.1"/>
  <!-- Card on screen -->
  <rect x="198" y="175" width="116" height="75" rx="8" fill="url(#g1)" opacity="0.7"/>
  <circle cx="222" cy="205" r="12" fill="#1a1a2e" opacity="0.3"/>
  <rect x="242" y="197" width="55" height="5" rx="2.5" fill="#1a1a2e" opacity="0.3"/>
  <rect x="242" y="210" width="40" height="4" rx="2" fill="#1a1a2e" opacity="0.2"/>
  <!-- Android icon below card -->
  <rect x="228" y="275" width="56" height="35" rx="8" fill="url(#g2)" opacity="0.7"/>
  <rect x="234" y="260" width="44" height="24" rx="14" fill="url(#g2)" opacity="0.7"/>
  <circle cx="246" cy="270" r="4" fill="#1a1a2e"/>
  <circle cx="266" cy="270" r="4" fill="#1a1a2e"/>
  <line x1="244" y1="258" x2="240" y2="248" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="258" x2="272" y2="248" stroke="url(#g2)" stroke-width="3" stroke-linecap="round"/>
  <!-- Notch -->
  <rect x="232" y="128" width="48" height="10" rx="5" fill="#1a1a2e"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="120" cy="370" r="5"/>
    <circle cx="395" cy="150" r="5"/>
