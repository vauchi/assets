<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Globe circle -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#g1)" stroke-width="4"/>
  <!-- Longitude lines -->
  <ellipse cx="256" cy="256" rx="50" ry="100" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="256" cy="256" rx="20" ry="100" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.4"/>
  <!-- Latitude lines -->
  <ellipse cx="256" cy="256" rx="100" ry="35" fill="none" stroke="url(#g1)" stroke-width="2.5" opacity="0.6"/>
  <line x1="156" y1="256" x2="356" y2="256" stroke="url(#g1)" stroke-width="2" opacity="0.4"/>
  <!-- Globe fill -->
  <circle cx="256" cy="256" r="100" fill="url(#g1)" opacity="0.15"/>
  <!-- Cursor arrow -->
  <g transform="translate(320, 310)">
    <path d="M0,0 L0,45 L12,35 L22,55 L32,50 L22,30 L38,30 Z"
          fill="url(#g2)" stroke="#1a1a2e" stroke-width="2"/>
  </g>
  <!-- Signal arcs -->
  <g stroke="url(#g2)" stroke-width="2.5" fill="none" opacity="0.4">
    <path d="M160,168 Q140,200 155,230"/>
    <path d="M350,168 Q370,200 355,230"/>
  </g>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="130" cy="390" r="5"/>
    <circle cx="385" cy="130" r="5"/>
  </g>

</svg>