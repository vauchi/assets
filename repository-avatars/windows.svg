<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26c6da"/>
      <stop offset="100%" style="stop-color:#00838f"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Windows four-pane logo -->
  <!-- Top-left -->
  <path d="M140,160 L242,148 L242,246 L140,246 Z" fill="url(#g1)" opacity="0.8"/>
  <!-- Top-right -->
  <path d="M258,146 L372,130 L372,246 L258,246 Z" fill="url(#g1)" opacity="0.7"/>
  <!-- Bottom-left -->
  <path d="M140,262 L242,262 L242,360 L140,348 Z" fill="url(#g2)" opacity="0.7"/>
  <!-- Bottom-right -->
  <path d="M258,262 L372,262 L372,380 L258,362 Z" fill="url(#g2)" opacity="0.6"/>
  <!-- Subtle frame -->
  <rect x="130" y="126" width="252" height="260" rx="8" fill="none"
        stroke="#4fc3f7" stroke-width="2" opacity="0.15"/>
  <!-- Accent dots -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="110" cy="410" r="5"/>
    <circle cx="405" cy="110" r="5"/>
  </g>

</svg>
